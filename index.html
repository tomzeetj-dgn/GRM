<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="meta.home.title">GRM — Studio · Label · Liveroom</title>
  <meta name="description" content="GRM is an umbrella brand in Belgrade — a recording and production studio, a record label, and a live rehearsal room. Three worlds under one roof." data-i18n-content="meta.home.desc">
  <meta name="theme-color" content="#050505">

  <meta property="og:title" content="GRM — Studio · Label · Liveroom" data-i18n-content="meta.home.ogTitle">
  <meta property="og:description" content="GRM Studio · GRM Label · GRM Liveroom — three worlds in Belgrade." data-i18n-content="meta.home.ogDesc">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="en">
  <!-- TODO: replace with the production domain once live -->
  <meta property="og:url" content="/">
  <meta property="og:image" content="assets/img/grm-tile-1.png">

  <link rel="icon" type="image/png" href="assets/img/favicon.png">
  <link rel="preload" as="image" href="assets/img/GRM 4K_Background.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62.5,100..900;1,62.5,100..900&family=Inter:wght@300;400;500;600&display=swap">

  <link rel="stylesheet" href="css/style.css">

  <script src="js/translations.js"></script>
  <script src="js/i18n.js"></script>

  <script>
    (function () {
      var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      var seen = false;
      try { seen = sessionStorage.getItem("grm-home-intro-seen") === "1"; } catch (e) {}
      if (!seen && !reduce) document.documentElement.classList.add("home-intro-pending");
    }());
  </script>
</head>
  <body data-page="home">
  <a class="skip-link" href="#main" data-i18n="common.skip">Skip to content</a>
  <div class="progress" id="progress" aria-hidden="true"></div>

  <!-- Shared header + mobile menu + footer, injected by js/main.js -->
  <div id="headerMount" data-root=""></div>

  <main id="main" tabindex="-1">

     <!-- ============================================================
          HERO — three GRM worlds
          Hover previews a world; clicking enters it. The hero IS the
          entire homepage.
          ============================================================ -->
    <section class="hero" id="top" aria-label="GRM — Studio, Label, Liveroom" data-i18n-aria-label="home.hero.aria">
      <div class="hero__logo-stage" aria-hidden="true"></div>
      <div class="hero__panels" id="heroPanels" data-hero="true">

        <a class="panel" id="panelProduction" href="studio/"
             aria-expanded="false"
             aria-label="GRM Studio — recording, composition, production, mixing and mastering" data-i18n-aria-label="home.panel.studio.aria">
          <div class="panel__logo-window panel__logo-window--studio" aria-hidden="true">
            <img src="assets/img/GRM Studio NoGlow.png" alt="">
            <img class="panel__logo--glow" src="assets/img/GRM Studio Glow.png" alt="" aria-hidden="true">
          </div>
          <div class="panel__mobile">
            <span class="panel__mobile-media" aria-hidden="true"></span>
            <span class="panel__mobile-scrim" aria-hidden="true"></span>
            <span class="panel__mobile-tint" aria-hidden="true"></span>
            <div class="panel__mobile-body">
              <img class="panel__mobile-logo" src="assets/img/GRM Studio Glow.png" alt="" width="2160" height="2160" aria-hidden="true">
              <p class="panel__mobile-title" data-i18n="home.panel.studio.title">Studio</p>
              <span class="panel__mobile-rule" aria-hidden="true"></span>
              <p class="panel__mobile-desc" data-i18n="home.panel.studio.desc">Audio / Video Production</p>
            </div>
            <span class="panel__mobile-arrow" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square"><path d="M6 18 18 6"></path><path d="M9 6h9v9"></path></svg>
            </span>
          </div>
          <div class="panel__content">
            <div class="panel__copy">
              <span class="panel__name" data-i18n="home.panel.studio.name">Production</span>
              <p class="panel__tag" data-i18n="home.panel.studio.tag">Audio/Video Production</p>
            </div>
          </div>
        </a>

        <a class="panel" id="panelHouse" href="label/"
             aria-expanded="false"
             aria-label="GRM Label — GRM's record label" data-i18n-aria-label="home.panel.label.aria">
          <div class="panel__logo-window panel__logo-window--label" aria-hidden="true">
            <img src="assets/img/GRM Label NoGlow.png" alt="">
            <img class="panel__logo--glow" src="assets/img/GRM Label Glow.png" alt="" aria-hidden="true">
          </div>
          <div class="panel__mobile">
            <span class="panel__mobile-media" aria-hidden="true"></span>
            <span class="panel__mobile-scrim" aria-hidden="true"></span>
            <span class="panel__mobile-tint" aria-hidden="true"></span>
            <div class="panel__mobile-body">
              <img class="panel__mobile-logo" src="assets/img/GRM Label Glow.png" alt="" width="2160" height="2160" aria-hidden="true">
              <p class="panel__mobile-title" data-i18n="home.panel.label.title">Label</p>
              <span class="panel__mobile-rule" aria-hidden="true"></span>
              <p class="panel__mobile-desc" data-i18n="home.panel.label.desc">Artists &amp; Releases</p>
            </div>
            <span class="panel__mobile-arrow" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square"><path d="M6 18 18 6"></path><path d="M9 6h9v9"></path></svg>
            </span>
          </div>
          <div class="panel__content">
            <div class="panel__copy">
              <span class="panel__name" data-i18n="home.panel.label.name">Label</span>
              <p class="panel__tag" data-i18n="home.panel.label.tag">GRM's record label</p>
            </div>
          </div>
        </a>

        <a class="panel" id="panelLive" href="liveroom/"
             aria-expanded="false"
             aria-label="GRM Liveroom — rehearsal space for musicians and bands" data-i18n-aria-label="home.panel.liveroom.aria">
          <div class="panel__logo-window panel__logo-window--live" aria-hidden="true">
            <img src="assets/img/GRM LiveRoom NoGlow.png" alt="">
            <img class="panel__logo--glow" src="assets/img/GRM LiveRoom Glow.png" alt="" aria-hidden="true">
          </div>
          <div class="panel__mobile">
            <span class="panel__mobile-media" aria-hidden="true"></span>
            <span class="panel__mobile-scrim" aria-hidden="true"></span>
            <span class="panel__mobile-tint" aria-hidden="true"></span>
            <div class="panel__mobile-body">
              <img class="panel__mobile-logo" src="assets/img/GRM LiveRoom Glow.png" alt="" width="2160" height="2160" aria-hidden="true">
              <p class="panel__mobile-title" data-i18n="home.panel.liveroom.title">Liveroom</p>
              <span class="panel__mobile-rule" aria-hidden="true"></span>
              <p class="panel__mobile-desc" data-i18n="home.panel.liveroom.desc">Live Events &amp; Rehearsals</p>
            </div>
            <span class="panel__mobile-arrow" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square"><path d="M6 18 18 6"></path><path d="M9 6h9v9"></path></svg>
            </span>
          </div>
          <div class="panel__content">
            <div class="panel__copy">
              <span class="panel__name" data-i18n="home.panel.liveroom.name">Liveroom</span>
              <p class="panel__tag" data-i18n="home.panel.liveroom.tag">Rehearsal space for musicians and bands</p>
            </div>
          </div>
        </a>

      </div>
    </section>

  </main>

  <script src="js/main.js"></script>
</body>
</html>
